<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="FairPlay — the volunteer coach's game-day autopilot. Fair rotations, live play-time tracking, and parent-proof equity reports for youth sports.">
<title>FairPlay — Every Kid Plays</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <button id="btn-home" class="brand" title="Home">
    <span class="brand-mark">▶</span> Fair<span class="accent">Play</span>
  </button>
  <div id="topbar-context" class="topbar-context"></div>
</header>

<main id="app"></main>

<nav class="tabbar" id="tabbar">
  <button data-view="teams" class="tab active"><span class="tab-ico">🏟️</span>Teams</button>
  <button data-view="roster" class="tab"><span class="tab-ico">🧢</span>Roster</button>
  <button data-view="game" class="tab tab-big"><span class="tab-ico">▶</span>Game</button>
  <button data-view="season" class="tab"><span class="tab-ico">📊</span>Season</button>
  <button data-view="settings" class="tab"><span class="tab-ico">⚙️</span>More</button>
</nav>

<div id="toast" class="toast" hidden></div>
<div id="modal-root"></div>

<script src="js/engine.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
